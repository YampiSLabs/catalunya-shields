name: Update Municipal Shields

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      review_limit:
        description: "Maximum missing municipalities to review"
        required: false
        default: "50"
      download_limit:
        description: "Maximum SVG shields to download"
        required: false
        default: "5"
  pull_request:
    branches: [main]
    paths:
      - "assets/svg/**"
      - "data/**"
      - "docs/**"
      - "raw/svg/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/update-shields.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-municipal-shields
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test run

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SHIELDS_REVIEW_LIMIT: ${{ github.event.inputs.review_limit || vars.SHIELDS_REVIEW_LIMIT || vars.SHIELDS_UPDATE_LIMIT || '50' }}
      SHIELDS_DOWNLOAD_LIMIT: ${{ github.event.inputs.download_limit || vars.SHIELDS_DOWNLOAD_LIMIT || '5' }}
      WIKIMEDIA_DELAY_MS: ${{ vars.WIKIMEDIA_DELAY_MS || '10000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Normalize municipality data
        run: pnpm normalize

      - name: Dry-run Commons candidate review
        run: pnpm download:commons -- --dry-run --review-limit="$SHIELDS_REVIEW_LIMIT" --download-limit="$SHIELDS_DOWNLOAD_LIMIT"

      - name: Download new real shields from Commons
        run: pnpm download:commons -- --review-limit="$SHIELDS_REVIEW_LIMIT" --download-limit="$SHIELDS_DOWNLOAD_LIMIT"

      - name: Optimize and regenerate package outputs
        run: |
          pnpm optimize:shields
          pnpm generate:outputs

      - run: pnpm test run

      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          token: ${{ secrets.BEATRIZ_AGENT_PAT || github.token }}
          branch: beatriz/update-municipal-shields
          delete-branch: true
          add-paths: |
            assets/svg/**
            data/commons-candidates/**
            docs/shields-status.md
            raw/svg/**
            src/index.ts
          commit-message: "feat(auto): update municipal shields"
          committer: "BeatrizAgent <beatrizagent@users.noreply.github.com>"
          author: "BeatrizAgent <beatrizagent@users.noreply.github.com>"
          title: "feat(auto): update municipal shields"
          body: |
            Automated update from Wikimedia Commons.

            The workflow uses a dry-run first, downloads a limited batch of high-confidence real SVG shield candidates, optimizes the SVG assets, regenerates package exports, and runs tests before creating this PR.

      - name: Merge generated shield update
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.BEATRIZ_AGENT_PAT || github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q '.headRefOid')
          if [ "$CURRENT_SHA" = "$PR_HEAD_SHA" ]; then
            gh pr merge "$PR_NUMBER" --squash --delete-branch
          else
            echo "PR head changed ($CURRENT_SHA != $PR_HEAD_SHA), skipping merge"
          fi
