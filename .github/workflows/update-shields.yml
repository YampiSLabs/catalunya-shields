name: Update Municipal Shields

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      review_limit:
        description: "Maximum missing municipalities to review"
        required: false
        default: "50"
      download_limit:
        description: "Maximum SVG shields to download"
        required: false
        default: "5"
  pull_request:
    branches: [main]
    paths:
      - "assets/svg/**"
      - "data/**"
      - "docs/**"
      - "raw/svg/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".github/workflows/update-shields.yml"

permissions:
  contents: write

concurrency:
  group: update-municipal-shields
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test run

      - name: Build Docker image
        run: docker build --tag catalunya-shields:ci .

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SHIELDS_REVIEW_LIMIT: ${{ github.event.inputs.review_limit || vars.SHIELDS_REVIEW_LIMIT || vars.SHIELDS_UPDATE_LIMIT || '50' }}
      SHIELDS_DOWNLOAD_LIMIT: ${{ github.event.inputs.download_limit || vars.SHIELDS_DOWNLOAD_LIMIT || '5' }}
      WIKIMEDIA_DELAY_MS: ${{ vars.WIKIMEDIA_DELAY_MS || '10000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Normalize municipality data
        run: pnpm normalize

      - name: Dry-run Commons candidate review
        run: pnpm download:commons -- --dry-run --review-limit="$SHIELDS_REVIEW_LIMIT" --download-limit="$SHIELDS_DOWNLOAD_LIMIT"

      - name: Download new real shields from Commons
        run: pnpm download:commons -- --review-limit="$SHIELDS_REVIEW_LIMIT" --download-limit="$SHIELDS_DOWNLOAD_LIMIT"

      - name: Optimize and regenerate package outputs
        run: |
          pnpm optimize:shields
          pnpm generate:outputs

      - run: pnpm typecheck

      - run: pnpm test run

      - name: Commit generated shield update
        run: |
          git add -- assets/svg data/commons-candidates data/missing-shields.json docs/shields-status.md raw/svg src/index.ts
          if git diff --cached --quiet; then
            echo "No generated shield changes to commit"
            exit 0
          fi
          git -c user.name="BeatrizAgent" -c user.email="beatrizagent@users.noreply.github.com" commit -m "feat(auto): update municipal shields"
          git push origin HEAD:main
